plugins {
    id 'com.android.application'
}

android {
    namespace 'com.echoes.silverback'
    compileSdk 35

    defaultConfig {
        applicationId 'com.echoes.silverback'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
