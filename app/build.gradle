plugins {
    id 'com.android.application'
}

android {
    namespace 'com.echoes.silverback'
    compileSdk 35

    defaultConfig {
        applicationId 'com.echoes.silverback'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '1.6'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
